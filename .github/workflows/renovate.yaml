# Manually triggered Renovate workflow for dependency updates. After each
# run, held security branches are re-evaluated so updates waiting for a
# CVSS score are re-checked instead of staying frozen.
#
# Requires a GitHub App installed on this repository with contents:write,
# pull-requests:write, issues:write, workflows:write, statuses:write, and
# dependabot-alerts:read permissions. Store the App ID and private key in
# the RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY Actions secrets.

name: Renovate

on:
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
          additional-env-list: |
            LOG_FILE
            LOG_FILE_FORMAT
            LOG_FILE_LEVEL
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^make vendor$"]'
          LOG_FILE: /tmp/renovate.log
          LOG_FILE_FORMAT: pretty
          LOG_FILE_LEVEL: debug

      - name: Upload Renovate debug artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: renovate-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/renovate.log
            renovate.json
          if-no-files-found: warn
          retention-days: 7

  reevaluate-held-security-branches:
    needs: renovate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-evaluate held security branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Renovate pushes a branch only when its content changes, so a held
          # security branch (kept because a fixed CVE has no CVSS score yet)
          # never triggers the PR opener on its own again. Re-evaluate every
          # held branch: a security branch with no open pull request and no
          # validation already in progress.
          for branch in $(gh api --paginate 'repos/{owner}/{repo}/branches?per_page=100' \
              --jq '.[].name | select(startswith("renovate/security/"))'); do
            if [[ "$(gh pr list --head "${branch}" --state open --json number --jq 'length')" != "0" ]]; then
              echo "${branch}: an open pull request already tracks it; nothing to re-evaluate."
              continue
            fi

            latest_status="$(gh run list --workflow renovate-pr-opener.yaml \
              --branch "${branch}" --limit 1 \
              --json status --jq '.[0].status // ""')"
            if [[ "${latest_status}" == "queued" || "${latest_status}" == "in_progress" ]]; then
              echo "${branch}: a validation run is already ${latest_status}."
              continue
            fi

            if gh workflow run renovate-pr-opener.yaml --ref "${branch}"; then
              echo "${branch}: dispatched the PR opener to re-evaluate it."
            else
              # The branch predates the PR opener's workflow_dispatch
              # trigger, so the workflow file at that ref cannot be
              # dispatched; re-running its latest validation re-executes
              # that run's original workflow version. A re-run publishes
              # the commit it validates, so only re-run it while the
              # branch still points at that commit — a moved branch is
              # left to the run its newer push triggers.
              latest_run="$(gh run list --workflow renovate-pr-opener.yaml \
                --branch "${branch}" --limit 1 \
                --json databaseId,headSha \
                --jq '(.[0] // {}) | [.databaseId // "", .headSha // ""] | @tsv')"
              IFS=$'\t' read -r latest_run_id latest_head_sha <<<"${latest_run}"
              if [[ -z "${latest_run_id}" ]]; then
                echo "${branch}: no previous validation run to re-run; skipping."
                continue
              fi
              branch_tip="$(gh api "repos/{owner}/{repo}/branches/${branch//\//%2F}" --jq .commit.sha)"
              if [[ "${branch_tip}" != "${latest_head_sha}" ]]; then
                echo "${branch}: moved to ${branch_tip} since run ${latest_run_id} validated ${latest_head_sha}; leaving it to a newer run."
                continue
              fi
              if gh run rerun "${latest_run_id}"; then
                echo "${branch}: re-ran validation run ${latest_run_id} to re-evaluate it."
              else
                echo "${branch}: re-running validation run ${latest_run_id} failed; skipping."
              fi
            fi
          done
