name: Renovate

on:
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
          additional-env-list: |
            LOG_FILE
            LOG_FILE_FORMAT
            LOG_FILE_LEVEL
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^make vendor$"]'
          LOG_FILE: /tmp/renovate.log
          LOG_FILE_FORMAT: pretty
          LOG_FILE_LEVEL: debug

      - name: Upload Renovate debug artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: renovate-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/renovate.log
            renovate.json
          if-no-files-found: warn
          retention-days: 7
