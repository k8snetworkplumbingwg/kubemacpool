# Manually triggered Renovate workflow for dependency updates.
#
# Requires a GitHub App installed on this repository with contents:write,
# pull-requests:write, issues:write, workflows:write, statuses:write, and
# dependabot-alerts:read permissions. Store the App ID and private key in
# the RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY Actions secrets.

name: Renovate

on:
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
          additional-env-list: |
            LOG_FILE
            LOG_FILE_FORMAT
            LOG_FILE_LEVEL
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^make vendor$"]'
          LOG_FILE: /tmp/renovate.log
          LOG_FILE_FORMAT: pretty
          LOG_FILE_LEVEL: debug

      - name: Upload Renovate debug artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: renovate-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/renovate.log
            renovate.json
          if-no-files-found: warn
          retention-days: 7
